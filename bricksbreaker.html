<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bricks Breaker Pro - Fully Featured</title>
    <style>
        :root {
            --primary: #00ccff;
            --secondary: #ff6600;
            --bg-dark: #111;
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #2a2a40);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #gameWrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #topBar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            background: var(--glass);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--glass-border);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        #scoreBoard {
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
        }

        canvas {
            background: var(--bg-dark);
            border: 3px solid #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--primary);
        }

        .btn {
            background: var(--primary);
            border: none;
            color: #111;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--primary);
            transition: all 0.2s;
            text-transform: uppercase;
            min-width: 160px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--primary);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: #111;
        }

        #pauseBtn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            transition: transform 0.2s;
        }

        #pauseBtn:hover {
            transform: scale(1.1);
            color: var(--primary);
        }

        #highScoreText {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
        }

        /* Power-up indicators */
        #activePowerUps {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            pointer-events: none;
        }

        .p-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                opacity: 0.8;
            }

            to {
                transform: scale(1.1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="gameWrapper">
        <div id="topBar">
            <div id="scoreBoard">LEVEL 1 | SCORE: 0 | LIVES: 3</div>
            <button id="pauseBtn">⏸</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="activePowerUps"></div>

        <!-- Start Menu -->
        <div id="menuOverlay" class="overlay">
            <h1>Bricks Breaker</h1>
            <button id="startBtn" class="btn">Play Game</button>
            <a href="portfolio.html"><button id="exit" class="btn">Exit</button></a>
            <div id="highScoreText">High Score: 0</div>
        </div>

        <!-- Pause Menu -->
        <div id="pauseOverlay" class="overlay hidden">
            <h1>Paused</h1>
            <button id="resumeBtn" class="btn">Resume</button>
            <button id="restartBtn" class="btn btn-secondary">Restart</button>
            <button id="exitBtn" class="btn btn-secondary">Main Menu</button>
        </div>

        <!-- Game Over Menu -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h1 id="gameOverTitle">Game Over</h1>
            <div id="finalScore" style="margin-bottom: 20px; font-size: 20px;">Score: 0</div>
            <button id="playAgainBtn" class="btn">Play Again</button>
            <button id="exitToMenuBtn" class="btn btn-secondary">Main Menu</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreBoard = document.getElementById("scoreBoard");
        const highscoreDisplay = document.getElementById("highScoreText");
        const activePowerUpsContainer = document.getElementById("activePowerUps");

        // UI Elements
        const menuOverlay = document.getElementById("menuOverlay");
        const pauseOverlay = document.getElementById("pauseOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");

        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resumeBtn = document.getElementById("resumeBtn");
        const restartBtn = document.getElementById("restartBtn");
        const exitBtn = document.getElementById("exitBtn");
        const playAgainBtn = document.getElementById("playAgainBtn");
        const exitToMenuBtn = document.getElementById("exitToMenuBtn");

        // Game Constants
        const BASE_PADDLE_WIDTH = 0.25;
        const BALL_SPEED = 4;

        // Game State
        let gameRunning = false;
        let paused = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let highscore = localStorage.getItem("bricksbreaker_hs") || 0;
        highscoreDisplay.textContent = `High Score: ${highscore}`;

        // Game Entities
        let paddle, balls, bricks, particles, powerUps;
        let animationFrameId;

        class Sound {
            constructor() {
                this.audioCtx = null;
            }
            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            play(freq, type = 'sine', duration = 0.1, volume = 0.1) {
                this.init();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + duration);
            }
            paddle() { this.play(300, 'square', 0.1, 0.05); }
            brick() { this.play(600 + Math.random() * 200, 'sine', 0.1, 0.05); }
            powerup() { this.play(800, 'triangle', 0.3, 0.05); }
            die() { this.play(150, 'sawtooth', 0.5, 0.1); }
        }
        const sfx = new Sound();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.random() * 4 + 2;
                this.color = color;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'wide', 'multi', 'slow'
                this.speed = 2;
                this.color = type === 'wide' ? '#00ccff' : type === 'multi' ? '#ffcc00' : '#ff00ff';
                this.symbol = type === 'wide' ? '↔' : type === 'multi' ? '3' : 'S';
            }
            update() {
                this.y += this.speed;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                ctx.fillText(this.symbol, this.x, this.y + 4);
            }
        }

        function resizeCanvas() {
            let w = Math.min(window.innerWidth * 0.95, 500);
            let h = w * (16 / 9);
            if (h > window.innerHeight * 0.8) {
                h = window.innerHeight * 0.8;
                w = h * (9 / 16);
            }
            canvas.width = w;
            canvas.height = h;
            if (gameRunning) {
                // Adjust positions on resize
                paddle.y = canvas.height - 40;
                paddle.x = Math.min(paddle.x, canvas.width - paddle.w);
            }
        }

        function initGame() {
            score = 0;
            lives = 3;
            level = 1;
            gameRunning = true;
            paused = false;
            particles = [];
            powerUps = [];
            activePowerUpsContainer.innerHTML = '';

            resetPositions();
            createBricks();
            updateUI();

            menuOverlay.classList.add("hidden");
            pauseOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");

            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function resetPositions() {
            paddle = {
                w: canvas.width * BASE_PADDLE_WIDTH,
                h: 12,
                x: (canvas.width - canvas.width * BASE_PADDLE_WIDTH) / 2,
                y: canvas.height - 40,
                color: "#00ccff",
                targetW: canvas.width * BASE_PADDLE_WIDTH
            };
            balls = [{
                x: canvas.width / 2,
                y: paddle.y - 15,
                dx: BALL_SPEED * (Math.random() > 0.5 ? 1 : -1),
                dy: -BALL_SPEED,
                radius: 8,
                color: "#ff6600"
            }];
        }

        function createBricks() {
            const cols = 7;
            const rows = 3 + Math.min(level, 5);
            const padding = 6;
            const offsetTop = 40;
            const offsetLeft = 15;
            const bWidth = (canvas.width - offsetLeft * 2 - (cols - 1) * padding) / cols;
            const bHeight = 18;

            bricks = [];
            for (let c = 0; c < cols; c++) {
                bricks[c] = [];
                for (let r = 0; r < rows; r++) {
                    let status = 1;
                    if (level % 2 === 0 && (c + r) % 2 === 0) status = 0;
                    if (level % 3 === 0 && (c === 0 || c === cols - 1)) status = 0;

                    bricks[c][r] = {
                        x: offsetLeft + c * (bWidth + padding),
                        y: offsetTop + r * (bHeight + padding),
                        w: bWidth,
                        h: bHeight,
                        status: status,
                        color: `hsl(${(r * 30) + (c * 10) + level * 20}, 70%, 50%)`
                    };
                }
            }
        }

        function handleInput(e) {
            if (!gameRunning || paused) return;
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let relativeX = (clientX - rect.left) * (canvas.width / rect.width);

            paddle.x = relativeX - paddle.w / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
        }

        window.addEventListener("mousemove", handleInput);
        window.addEventListener("touchmove", (e) => {
            handleInput(e);
            e.preventDefault();
        }, { passive: false });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bricks
            bricks.forEach(column => {
                column.forEach(b => {
                    if (b.status === 1) {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
                        ctx.fill();
                        ctx.fillStyle = "rgba(255,255,255,0.2)";
                        ctx.fillRect(b.x, b.y, b.w, 3);
                    }
                });
            });

            // Draw Particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Draw Power-ups
            powerUps.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.y + 12 > paddle.y && p.x > paddle.x && p.x < paddle.x + paddle.w) {
                    applyPowerUp(p.type);
                    sfx.powerup();
                    powerUps.splice(index, 1);
                } else if (p.y > canvas.height) {
                    powerUps.splice(index, 1);
                }
            });

            // Draw Paddle
            paddle.w += (paddle.targetW - paddle.w) * 0.1;
            ctx.fillStyle = paddle.color;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
            ctx.fill();

            // Draw Balls
            balls.forEach((ball, index) => {
                ctx.fillStyle = ball.color;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                if (!paused) {
                    ball.x += ball.dx;
                    ball.y += ball.dy;

                    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                        ball.dx = -ball.dx;
                        sfx.paddle();
                    }
                    if (ball.y - ball.radius < 0) {
                        ball.dy = -ball.dy;
                        sfx.paddle();
                    }

                    if (ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                        ball.dy = -Math.abs(ball.dy);
                        let hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                        ball.dx = hitPos * BALL_SPEED * 1.5;
                        sfx.paddle();
                    }

                    bricks.forEach(column => {
                        column.forEach(b => {
                            if (b.status === 1) {
                                if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                                    ball.dy = -ball.dy;
                                    b.status = 0;
                                    score += 10;
                                    sfx.brick();
                                    createExplosion(b.x + b.w / 2, b.y + b.h / 2, b.color);
                                    checkWin();

                                    if (Math.random() < 0.15) {
                                        const types = ['wide', 'multi', 'slow'];
                                        powerUps.push(new PowerUp(b.x + b.w / 2, b.y + b.h / 2, types[Math.floor(Math.random() * types.length)]));
                                    }
                                }
                            }
                        });
                    });

                    if (ball.y > canvas.height) {
                        balls.splice(index, 1);
                        if (balls.length === 0) {
                            handleLifeLost();
                        }
                    }
                }
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function applyPowerUp(type) {
            if (type === 'wide') {
                paddle.targetW = canvas.width * 0.45;
                showIndicator('Wide', '#00ccff');
                setTimeout(() => paddle.targetW = canvas.width * BASE_PADDLE_WIDTH, 8000);
            } else if (type === 'multi') {
                const b = balls[0] || { x: canvas.width / 2, y: 100, dx: 3, dy: 3 };
                balls.push(
                    { ...b, dx: -b.dx, dy: -Math.abs(b.dy) },
                    { ...b, dx: b.dx * 0.5, dy: -Math.abs(b.dy) }
                );
                showIndicator('Multi', '#ffcc00');
            } else if (type === 'slow') {
                balls.forEach(b => { b.dx *= 0.6; b.dy *= 0.6; });
                showIndicator('Slow', '#ff00ff');
                setTimeout(() => {
                    balls.forEach(b => { b.dx /= 0.6; b.dy /= 0.6; });
                }, 5000);
            }
        }

        function showIndicator(text, color) {
            const el = document.createElement('div');
            el.className = 'p-icon';
            el.style.borderColor = color;
            el.style.color = color;
            el.innerText = text[0];
            activePowerUpsContainer.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }

        function handleLifeLost() {
            lives--;
            sfx.die();
            if (lives <= 0) {
                endGame(false);
            } else {
                updateUI();
                resetPositions();
            }
        }

        function checkWin() {
            let win = true;
            bricks.forEach(col => col.forEach(b => { if (b.status === 1) win = false; }));
            if (win) {
                level++;
                sfx.powerup();
                createBricks();
                resetPositions();
                updateUI();
            }
        }

        function updateUI() {
            scoreBoard.textContent = `LEVEL ${level} | SCORE: ${score} | LIVES: ${lives}`;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("bricksbreaker_hs", highscore);
                highscoreDisplay.textContent = `High Score: ${highscore}`;
            }
        }

        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            if (paused) {
                pauseOverlay.classList.remove("hidden");
                cancelAnimationFrame(animationFrameId);
            } else {
                pauseOverlay.classList.add("hidden");
                gameLoop();
            }
        }

        function endGame(win) {
            gameRunning = false;
            gameOverOverlay.classList.remove("hidden");
            document.getElementById("gameOverTitle").textContent = win ? "You Win!" : "Game Over";
            document.getElementById("finalScore").textContent = `Final Score: ${score}`;
            updateUI();
        }

        function gameLoop() {
            if (gameRunning && !paused) {
                draw();
                updateUI();
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // Event Listeners
        startBtn.addEventListener("click", () => {
            sfx.init();
            initGame();
        });
        pauseBtn.addEventListener("click", togglePause);
        resumeBtn.addEventListener("click", togglePause);
        restartBtn.addEventListener("click", initGame);
        exitBtn.addEventListener("click", () => {
            gameRunning = false;
            menuOverlay.classList.remove("hidden");
            pauseOverlay.classList.add("hidden");
        });
        playAgainBtn.addEventListener("click", initGame);
        exitToMenuBtn.addEventListener("click", () => {
            gameRunning = false;
            menuOverlay.classList.remove("hidden");
            gameOverOverlay.classList.add("hidden");
        });

        // Initial setup
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // Helper for roundRect support
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
    </script>
</body>

</html>
